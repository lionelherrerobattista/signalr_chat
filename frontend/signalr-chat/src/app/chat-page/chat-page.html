<div class="chat-header">
  <h2 class="chat-title">Chat</h2>
  <a [routerLink]="'/'" class="btn btn--sm btn--home">Home</a>
</div>
<div class="chat-window">
  @for(message of this.chatApi.messages(); track $index) {
  <div [class]="checkMessageType(message)">
    <p class="message-header">{{ message.username }}</p>
    <p>{{ message.text }}</p>
  </div>
  }
</div>
<form class="chat-input" [formGroup]="messageForm" (ngSubmit)="onSubmit()">
  <input
    type="text"
    name="message"
    id="message"
    formControlName="message"
    placeholder="Write a message"
  />
  <button class="btn btn--sm" type="submit" [disabled]="!messageForm.valid">Send</button>
</form>
