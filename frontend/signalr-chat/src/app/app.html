<div class="main-page">
  <div class="main-page__title">
    <h1>SignalR chat</h1>
  </div>
  <div class="main-page__text">
    <p>Create a user and start chatting with your friends. This app is powered by SignalR.</p>
  </div>
  @if(this.chatApi.user().username === "") {
  <div class="create-user">
    <!-- TODO: separate into new component -->
    <form class="user-form" [formGroup]="usernameForm" (ngSubmit)="onSubmitUsername()">
      <div class="user-form__input">
        <label for="username">This will be your username:</label>
        <input type="text" name="username" id="username" formControlName="username" />
      </div>
      <button class="button" type="submit">Create User</button>
    </form>
  </div>
  } @else {
  <div class="chat-interface">
    <!-- TODO: separate into new component -->
    <h2>Chat:</h2>
    <!-- TODO: alternate messages sent with messages received -->
    @for(message of this.chatApi.messages(); track $index) {
    <p>{{ message.username + ': ' + message.text }}</p>
    }
    <form [formGroup]="messageForm" (ngSubmit)="onSubmit()">
      <label for="message">Message:</label>
      <input type="text" name="message" id="message" formControlName="message" />
      <button type="submit" [disabled]="!messageForm.valid">Send</button>
    </form>
  </div>
  }
</div>
