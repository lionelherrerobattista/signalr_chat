<form class="user-form" [formGroup]="usernameForm" (ngSubmit)="onSubmitUsername()">
  <div class="user-form__input">
    <label for="username">This will be your username:</label>
    <input
      type="text"
      name="username"
      id="username"
      formControlName="username"
      autocomplete="off"
      required
    />
  </div>
  <button [class]="!usernameForm.valid ? 'button button--disabled' : 'button'" type="submit">
    Create User
  </button>
</form>
